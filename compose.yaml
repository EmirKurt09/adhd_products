services:
  ekampus:
    build: .
    image: ekampus-asistan:latest
    container_name: ekampus
    env_file: .env
    environment:
      # .env'deki boş DATA_DIR/HEADLESS değerleri imajın ayarlarını ezmesin
      DATA_DIR: /data
      HEADLESS: "true"
    volumes:
      - ekampus-data:/data
    init: true
    shm_size: "1gb"   # Chromium /dev/shm'e yazar; varsayılan 64 MB çökmeye yol açar
    restart: unless-stopped
    # Paylaşılan sunucuda diğer servisleri (VPN vb.) korumak için sınırlar
    mem_limit: 1536m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ekampus-data:
